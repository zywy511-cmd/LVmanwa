workflows:
  ios-build:
    name: iOS Build (No Code Sign)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      vars:
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
    scripts:
      - name: Install dependencies
        script: |
          flutter pub get
          cd ios && pod install && cd ..
      - name: Build iOS
        script: |
          flutter build ios --release --no-codesign
      - name: Create IPA
        script: |
          APP_PATH="build/ios/iphoneos/Runner.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: Runner.app not found!"
            find build/ios -name "*.app" -type d
            exit 1
          fi
          echo "App found at: $APP_PATH"
          echo "App size: $(du -sh "$APP_PATH" | cut -f1)"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qr LVCP_no_codesign.ipa Payload
          rm -rf Payload
          echo "IPA created successfully"
          echo "IPA size: $(du -sh LVCP_no_codesign.ipa | cut -f1)"
    artifacts:
      - LVCP_no_codesign.ipa
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
