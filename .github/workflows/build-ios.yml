name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'

env:
  FLUTTER_VERSION: "3.35.0"

jobs:
  build-ios:
    name: Build iOS IPA (No Code Sign)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Pod install
        run: cd ios && pod install && cd ..

      - name: Build iOS (ignore codesign error)
        env:
          DANDANPLAY_APP_ID: ${{ secrets.DANDANPLAY_APP_ID }}
          DANDANPLAY_APP_SECRET: ${{ secrets.DANDANPLAY_APP_SECRET }}
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=DANDANPLAY_APP_ID="${DANDANPLAY_APP_ID}" \
            --dart-define=DANDANPLAY_APP_SECRET="${DANDANPLAY_APP_SECRET}" \
            || true

      - name: Find and package largest Runner.app
        run: |
          set -euo pipefail
          # 找到所有 Runner.app，选最大的那个
          APP_PATH=$(find build/ios -name "Runner.app" -type d -exec du -k {} \; | sort -nr | head -1 | cut -f2)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No Runner.app found!"
            find build/ios -type d
            exit 1
          fi
          echo "Found Runner.app at: $APP_PATH"
          echo "App size: $(du -sh "$APP_PATH" | cut -f1)"
          
          # 列出 app 内容
          echo "=== App contents ==="
          ls -la "$APP_PATH"
          
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qr LVCP.ipa Payload
          rm -rf Payload
          echo "IPA created successfully"
          echo "IPA size: $(du -sh LVCP.ipa | cut -f1)"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v6
        with:
          name: ios-ipa
          path: LVCP.ipa
          retention-days: 30
          if-no-files-found: error
